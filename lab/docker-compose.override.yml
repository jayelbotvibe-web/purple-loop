# Auto-merged with the official single-node docker-compose.yml.
# Purpose: cap indexer memory for a laptop, and add our victim host.
services:
  wazuh.indexer:
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms4g -Xmx4g"
    mem_limit: 8g

  victim:
    build:
      context: ../../victim
    image: purpleloop/victim:latest
    container_name: purpleloop-victim
    hostname: victim01
    restart: unless-stopped
    # Deliberately unprivileged. Running Sysmon for Linux here was tried and
    # measured (docs/PITFALLS.md): it needs privileged + systemd, and its eBPF
    # then observes the whole host with no container identity in the event, so
    # the telemetry cannot be attributed to this victim safely. A privileged
    # container in a security lab is not worth paying for a source that would
    # produce false attributions.
    cap_add:
      - AUDIT_CONTROL
      - AUDIT_READ
      - SYS_PTRACE
    environment:
      - WAZUH_MANAGER=wazuh.manager
      - WAZUH_AGENT_NAME=victim01
    depends_on:
      - wazuh.manager

title: System Network Configuration Discovery (Linux)
id: a1c0f2e4-0005-4b10-9c21-5f0a10160010
status: experimental
description: Detects local network configuration enumeration, as emitted by atomic T1016-3 (arp -a; ifconfig; ip addr; netstat -ant; route).
references:
  - https://attack.mitre.org/techniques/T1016/
author: purple-loop
date: 2026/08/29
logsource:
  product: linux
  category: process_creation
detection:
  legacy_tools:
    Image|endswith:
      - '/ifconfig'
      - '/arp'
      - '/route'
      - '/netstat'
  iproute:
    Image|endswith: '/ip'
    CommandLine|contains:
      - ' addr'
      - ' route'
      - ' link'
      - ' neigh'
  resolver:
    CommandLine|contains:
      - '/etc/resolv.conf'
      - '/etc/hosts'
  condition: legacy_tools or iproute or resolver
falsepositives:
  - Network troubleshooting by administrators
  - Container entrypoints inspecting their own interfaces
level: low
tags:
  - attack.discovery
  - attack.t1016

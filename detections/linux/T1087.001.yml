title: Local Account Enumeration (Linux)
id: a1c0f2e4-0001-4b10-9c21-5f0a10870010
status: experimental
description: Detects local account enumeration by reading the account databases, as emitted by atomic T1087.001-1 (cat /etc/passwd) and by getent/lastlog equivalents.
references:
  - https://attack.mitre.org/techniques/T1087/001/
author: purple-loop
date: 2026/08/29
logsource:
  product: linux
  category: process_creation
detection:
  read_account_db:
    CommandLine|contains:
      - '/etc/passwd'
      - '/etc/shadow'
  enum_tools:
    Image|endswith:
      - '/lastlog'
      - '/lslogins'
  getent_account_db:
    Image|endswith: '/getent'
    CommandLine|contains:
      - 'passwd'
      - 'shadow'
  condition: read_account_db or enum_tools or getent_account_db
falsepositives:
  - Backup and configuration-management tooling reading /etc/passwd
  - Identity agents resolving accounts through getent passwd
level: low
tags:
  - attack.discovery
  - attack.t1087.001

title: Local Permission Group Discovery (Linux)
id: a1c0f2e4-0007-4b10-9c21-5f0a10690010
status: experimental
description: Detects local group enumeration, as emitted by atomic T1069.001-1 (groups; cat /etc/group; getent group).
references:
  - https://attack.mitre.org/techniques/T1069/001/
author: purple-loop
date: 2026/08/29
logsource:
  product: linux
  category: process_creation
detection:
  group_db:
    CommandLine|contains:
      - '/etc/group'
      - '/etc/sudoers'
  group_tools:
    Image|endswith:
      - '/groups'
      - '/groupmems'
  getent_group:
    Image|endswith: '/getent'
    CommandLine|contains: 'group'
  condition: group_db or group_tools or getent_group
falsepositives:
  - Provisioning tools reconciling group membership
  - Login flows resolving supplementary groups
level: low
tags:
  - attack.discovery
  - attack.t1069.001

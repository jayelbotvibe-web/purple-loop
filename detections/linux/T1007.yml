title: System Service Discovery (Linux)
id: a1c0f2e4-0004-4b10-9c21-5f0a10070010
status: experimental
description: Detects service enumeration, as emitted by atomic T1007-3 (systemctl --type=service / service -e) and T1007-8 (init script listing).
references:
  - https://attack.mitre.org/techniques/T1007/
author: purple-loop
date: 2026/08/29
logsource:
  product: linux
  category: process_creation
detection:
  systemctl_list:
    Image|endswith: '/systemctl'
    CommandLine|contains:
      - '--type=service'
      - 'list-units'
      - 'list-unit-files'
  service_enum:
    Image|endswith:
      - '/service'
      - '/chkconfig'
  initscripts:
    CommandLine|contains: '/etc/init.d'
  condition: systemctl_list or service_enum or initscripts
falsepositives:
  - Administrators and provisioning tools inventorying services
  - Monitoring agents polling unit state
level: low
tags:
  - attack.discovery
  - attack.t1007

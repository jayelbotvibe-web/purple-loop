title: System Owner and User Discovery (Linux)
id: a1c0f2e4-0003-4b10-9c21-5f0a10330010
status: experimental
description: Detects enumeration of the current and logged-on users, as emitted by atomic T1033-2 (users; w; who).
references:
  - https://attack.mitre.org/techniques/T1033/
author: purple-loop
date: 2026/08/29
logsource:
  product: linux
  category: process_creation
detection:
  session_enum:
    Image|endswith:
      - '/users'
      - '/who'
      - '/w'
      - '/last'
  identity:
    Image|endswith:
      - '/whoami'
      - '/logname'
  condition: session_enum or identity
falsepositives:
  - Interactive administrators checking who is logged in
  - Monitoring agents sampling session counts
level: low
tags:
  - attack.discovery
  - attack.t1033

title: Network Share Discovery (Linux)
id: a1c0f2e4-0008-4b10-9c21-5f0a11350010
status: experimental
description: Detects network share enumeration, as emitted by the lab's T1135-1 override (reads of /proc/mounts filtered for network filesystems, showmount, smbclient) and by upstream smbstatus.
references:
  - https://attack.mitre.org/techniques/T1135/
author: purple-loop
date: 2026/08/29
logsource:
  product: linux
  category: process_creation
detection:
  smb_tools:
    Image|endswith:
      - '/smbclient'
      - '/smbstatus'
      - '/showmount'
      - '/nmblookup'
  mount_table:
    CommandLine|contains:
      - '/proc/mounts'
      - '/etc/fstab'
  network_mount:
    Image|endswith: '/mount'
    CommandLine|contains:
      - 'cifs'
      - 'nfs'
      - 'smb'
  condition: smb_tools or mount_table or network_mount
falsepositives:
  - Storage agents reading /proc/mounts or /etc/fstab
  - Backup tooling enumerating network filesystems
level: medium
tags:
  - attack.discovery
  - attack.t1135
